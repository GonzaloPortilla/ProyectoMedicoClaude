# PostgreSQL para desarrollo local. Uso: `docker compose up -d`
# Credenciales sólo para desarrollo (coinciden con .env.example). No usar en producción.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medapp
      POSTGRES_PASSWORD: medapp_dev_password
      POSTGRES_DB: medapp
    ports:
      - "5432:5432"
    volumes:
      - medapp-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medapp -d medapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medapp-db:
